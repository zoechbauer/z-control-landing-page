<app-header [currentTab]="currentTab" [showBackButton]="showBackButton"></app-header>

<ion-content class="ion-padding">
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-container">
    <ion-spinner name="circular"></ion-spinner>
    <p>Loading privacy policy...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="error-container">
    <h2>Privacy Policy Not Found</h2>
    <p>Sorry, the requested privacy policy could not be loaded.</p>
    <ion-button fill="outline" (click)="goBack()">
      <ion-icon name="chevron-back-outline" slot="start"></ion-icon>
      Back to Home
    </ion-button>
  </div>

  <!-- Policy Content -->
  <div *ngIf="policy && !loading && !error" class="policy-container">
    <!-- Policy Header -->
    <div class="policy-header">
      <h1>{{ policy.title }}</h1>
    </div>

    <!-- Policy Content -->
    <div class="policy-content" [innerHTML]="policy.content"></div>

    <!-- Back Button -->
    <div class="action-buttons" *ngIf="showBackButton">
      <ion-button fill="outline" (click)="goBack()" size="small">
        <ion-icon name="chevron-back-outline" slot="start"></ion-icon>
        {{ backToHomeButtonLabel }}
      </ion-button>
    </div>
  </div>
</ion-content>
