<app-header
  [currentTab]="currentTab"
  [showBackButton]="showBackButton"
></app-header>

<ion-content class="ion-padding">
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-container">
    <ion-spinner name="circular"></ion-spinner>
    <p>Loading privacy policy...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="error-container">
    <h2>Privacy Policy Not Found</h2>
    <p>Sorry, the requested privacy policy could not be loaded.</p>
    <ion-button fill="outline" (click)="goBack()">
      <ion-icon name="chevron-back-outline" slot="start"></ion-icon>
      Back to Home
    </ion-button>
  </div>

  <!-- Policy Content -->
  <div *ngIf="policy && !loading && !error" class="policy-container">
    <!-- Policy Header -->
    <div class="policy-header">
      <h1>{{ policy.title }}</h1>
    </div>

    <!-- Policy Content -->
    <div class="policy-content" [innerHTML]="policy.content"></div>

    <!-- Back Button -->
    <div class="ion-padding ion-text-center" *ngIf="showBackButton">
      <ion-button
        (click)="goBack()"
        (keydown.enter)="goBack()"
        title="{{ 'PRIVACY_VIEWER.TOOLTIPS.CLOSE' | translate }}"
        size="small"
        fill="clear"
      >
        <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
        {{ "PRIVACY_VIEWER.BUTTON.CLOSE" | translate }}
      </ion-button>
    </div>
  </div>
</ion-content>
