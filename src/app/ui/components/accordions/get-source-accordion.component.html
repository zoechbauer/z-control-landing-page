<ion-accordion value="LPS_GetSource" [disabled]="!isAnalyticsEnabled"
  title="{{
    utilsService.getSettingsAccordionTooltip(
      SettingsAccordion.LPS_GetSource,
      isAnalyticsEnabled,
      showAllAccordions
    ) | translate
  }}">
  <ion-item slot="header" color="light" class="accordion-margin-top">
    <ion-label>{{ "SETTINGS.SOURCE.ACCORDION" | translate }}</ion-label>
  </ion-item>
  <div class="ion-padding" slot="content" title="">
    <app-get-source-code [lang]="lang" [appNameKey]="appNameKey"></app-get-source-code>
  </div>
</ion-accordion>
