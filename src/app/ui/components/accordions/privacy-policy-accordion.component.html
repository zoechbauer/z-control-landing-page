<ion-accordion value="LPS_PrivacyPolicy"
  title="{{
    utilsService.getSettingsAccordionTooltip(
      SettingsAccordion.LPS_PrivacyPolicy,
      isAnalyticsEnabled,
      showAllAccordions
    ) | translate
  }}">
  <ion-item slot="header" color="light" class="accordion-margin-top">
    <ion-label>{{ "SETTINGS.PRIVACY.ACCORDION" | translate }}</ion-label>
  </ion-item>
  <div class="ion-padding" slot="content" title="" >
    <app-privacy-policy [lang]="lang"></app-privacy-policy>
  </div>
</ion-accordion>
