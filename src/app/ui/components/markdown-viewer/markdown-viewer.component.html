<ion-header>
  <ion-toolbar>
    <ion-title>
      <span *ngIf="utilsService.isSmallScreen" [innerHTML]="title2lines"></span>
      <span *ngIf="!utilsService.isSmallScreen" [innerHTML]="title1line"></span>
    </ion-title>
    <ion-buttons slot="start">
      <ion-button
        fill="clear"
        (click)="scrollToTop()"
        (keydown.enter)="scrollToTop()"
        (keydown.space)="scrollToTop()"
      >
        <ion-icon name="arrow-up-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button
        fill="clear"
        (click)="closeModal()"
        (keydown.enter)="closeModal()"
      >
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <markdown [data]="markdown"></markdown>
</ion-content>
